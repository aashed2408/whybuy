<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>The Cool Hat - Amazon.com</title>
  <!--
    Variant product fixture: title starts with "The", no byline.
    The extractor must NOT use "The" as a brand fallback (it should
    skip generic first-words). brand should be null.
  -->
</head>
<body>
  <h1>The Cool Hat</h1>

  <div id="titleSection">
    <h1 id="productTitle" class="a-size-large">
      The Cool Hat
    </h1>
  </div>

  <div class="a-section">
    <span class="a-price">
      <span class="a-offscreen">$19.99</span>
    </span>
  </div>

  <button type="button" class="a-button a-button-primary">
    Proceed to checkout
  </button>
</body>
</html>
