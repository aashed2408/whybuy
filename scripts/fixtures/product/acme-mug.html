<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Acme Mug - Amazon.com</title>
  <meta property="og:title" content="Acme Mug" />
  <!--
    Variant product fixture: no byline, no JSON-LD brand. The
    extractor must fall back to the first word of the title: "Acme".
  -->
</head>
<body>
  <h1>Acme Mug</h1>

  <div id="titleSection">
    <h1 id="productTitle" class="a-size-large">
      Acme Mug
    </h1>
  </div>

  <div class="a-section">
    <span class="a-price">
      <span class="a-offscreen">$12.99</span>
    </span>
  </div>

  <button type="button" class="a-button a-button-primary">
    Proceed to checkout
  </button>
</body>
</html>
